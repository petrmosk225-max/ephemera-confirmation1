<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2eee7">
    <meta name="description" content="Email подтверждён. Вернитесь в приложение Ephemera и войдите в аккаунт.">
    <title>Email подтверждён — Ephemera</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="confirmation-shell">
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>

      <section class="confirmation-card" aria-labelledby="confirmation-title">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-mark-core"></span>
          <span class="brand-mark-ring brand-mark-ring-one"></span>
          <span class="brand-mark-ring brand-mark-ring-two"></span>
        </div>

        <p class="eyebrow">EPHEMERA / ACCOUNT</p>
        <h1 id="confirmation-title">Email подтверждён</h1>
        <p class="lead">
          Ваш аккаунт готов. Теперь можно вернуться в приложение и войти с теми же email и паролем.
        </p>

        <div class="confirmation-note">
          <span class="note-dot" aria-hidden="true"></span>
          <span>Подтверждение прошло успешно</span>
        </div>

        <p class="footer-note">
          Это окно можно закрыть. Откройте Ephemera на телефоне и выберите «Войти».
        </p>
      </section>
    </main>
  </body>
</html>
